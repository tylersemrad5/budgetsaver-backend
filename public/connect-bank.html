<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">

  <title>BudgetSaver | Connect Bank</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: #f4f6fa;
      color: #162033;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      max-width: 470px;
      margin: 7vh auto;
      padding: 28px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 12px 40px #16203312;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    h2 {
      margin-top: 26px;
      font-size: 22px;
    }

    p {
      color: #58667c;
      line-height: 1.55;
    }

    label {
      display: block;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    button {
      width: 100%;
      min-height: 46px;
      margin-top: 11px;
      padding: 12px 14px;
      border-radius: 12px;
      font: inherit;
    }

    input {
      border: 1px solid #cbd5e1;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button.secondary {
      background: #eef2f8;
      color: #172033;
    }

    .hidden {
      display: none !important;
    }

    .notice {
      padding: 14px;
      background: #eff5ff;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .warning {
      background: #fff4e5;
    }

    .account {
      padding: 13px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .account strong {
      display: block;
    }

    .account span {
      display: block;
      color: #64748b;
      font-size: 13px;
      margin-top: 4px;
    }

    .muted {
      color: #64748b;
      font-size: 13px;
    }

    #status {
      margin-top: 20px;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main>
    <h1>BudgetSaver</h1>
    <p>Secure financial account connections</p>

    <section id="login">
      <h2>Sign in</h2>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="signIn" type="submit">
          Sign In
        </button>
      </form>
    </section>

    <section id="bank" class="hidden">
      <h2>Bank Connections</h2>

      <p>
        Your BudgetSaver account is authenticated.
      </p>

      <div id="modeNotice" class="notice">
        Checking Plaid connection status...
      </div>

      <button id="connect" disabled>
        Connect Test Bank
      </button>

      <button id="refresh" class="secondary">
        Refresh Accounts
      </button>

      <button id="sync" class="secondary">
        Sync Transactions
      </button>

      <div id="accounts"></div>
      <div id="syncResult" class="muted"></div>

      <button id="signOut" class="secondary">
        Sign Out
      </button>
    </section>

    <p id="status" role="status" aria-live="polite">
      Initializing secure authentication...
    </p>
  </main>

  <script
    src="https://cdn.plaid.com/link/v2/stable/link-initialize.js">
  </script>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIw9TYrf-OuHrTHvPONADexrfsMK0lw3E",
      authDomain: "budgetsaver-f76a9.firebaseapp.com",
      projectId: "budgetsaver-f76a9",
      storageBucket: "budgetsaver-f76a9.firebasestorage.app",
      messagingSenderId: "360891693628",
      appId: "1:360891693628:web:01ba8b47bf841e0adca139",
      measurementId: "G-1XDB1T7MBN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginSection =
      document.getElementById("login");

    const bankSection =
      document.getElementById("bank");

    const connectButton =
      document.getElementById("connect");

    const refreshButton =
      document.getElementById("refresh");

    const syncButton =
      document.getElementById("sync");

    const notice =
      document.getElementById("modeNotice");

    const accountsElement =
      document.getElementById("accounts");

    const statusElement =
      document.getElementById("status");

    const syncResultElement =
      document.getElementById("syncResult");

    let currentUser = null;
    let verified = false;
    let sandboxEnabled = false;
    let activeSessionId = null;
    let currentHandler = null;
    let startupCompleted = false;

    const isOAuthReturn =
      window.location.pathname === "/plaid/oauth";

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function clearSession() {
      sessionStorage.removeItem(
        "bs_link_session_id"
      );

      activeSessionId = null;
    }

    async function apiRequest(path, options = {}) {
      if (!currentUser) {
        throw new Error(
          "Please sign in before continuing."
        );
      }

      const idToken =
        await currentUser.getIdToken();

      const response = await fetch(path, {
        ...options,
        cache: "no-store",
        headers: {
          Authorization: "Bearer " + idToken,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error(
          "BudgetSaver returned an invalid response."
        );
      }

      if (!response.ok) {
        throw new Error(
          data.error || "Request failed."
        );
      }

      return data;
    }

    async function verifyAccount() {
      const response =
        await apiRequest("/api/auth/me");

      if (response.authenticated !== true) {
        throw new Error(
          "Your account is not authorized."
        );
      }
    }

    async function loadPlaidStatus() {
      const result =
        await apiRequest("/api/plaid/status");

      sandboxEnabled =
        result.mode === "sandbox" &&
        result.linking_enabled === true;

      if (sandboxEnabled) {
        notice.classList.remove("warning");
        notice.textContent =
          "Plaid Sandbox mode is enabled. " +
          "Only fictional test accounts may be connected.";

        connectButton.textContent =
          "Connect Test Bank";
        connectButton.disabled = false;
      } else {
        notice.classList.add("warning");

        if (result.environment === "production") {
          notice.textContent =
            "Plaid Production is configured, but live " +
            "bank linking is locked until required " +
            "security checks are complete.";
        } else {
          notice.textContent =
            "Plaid Sandbox linking is currently disabled.";
        }

        connectButton.textContent =
          "Bank Linking Not Yet Available";
        connectButton.disabled = true;
      }
    }

    function showAccounts(accounts) {
      accountsElement.replaceChildren();

      const heading = document.createElement("h3");
      heading.textContent = "Connected Accounts";
      accountsElement.appendChild(heading);

      if (!accounts.length) {
        const empty = document.createElement("p");
        empty.textContent =
          "No financial accounts connected yet.";
        accountsElement.appendChild(empty);
        return;
      }

      for (const account of accounts) {
        const container = document.createElement("div");
        container.className = "account";

        const name = document.createElement("strong");
        name.textContent =
          account.name || "Financial account";

        const details = document.createElement("span");
        details.textContent = account.mask
          ? `Account ending in ${account.mask}`
          : "Account number unavailable";

        const balance = document.createElement("span");

        if (
          account.current_balance !== null &&
          account.current_balance !== undefined
        ) {
          const amount = Number(account.current_balance);

          balance.textContent = Number.isFinite(amount)
            ? amount.toLocaleString("en-US", {
                style: "currency",
                currency: "USD"
              })
            : "Balance unavailable";
        } else {
          balance.textContent = "Balance unavailable";
        }

        container.appendChild(name);
        container.appendChild(details);
        container.appendChild(balance);
        accountsElement.appendChild(container);
      }
    }

    async function loadAccounts() {
      if (!verified) return;

      refreshButton.disabled = true;

      try {
        const result =
          await apiRequest("/api/accounts");

        showAccounts(result.accounts || []);

        setStatus(
          "Secure login verified. Account data loaded."
        );
      } catch (err) {
        setStatus(err.message);
      } finally {
        refreshButton.disabled = false;
      }
    }

    async function syncTransactions() {
      if (!verified) return;

      syncButton.disabled = true;
      syncResultElement.textContent =
        "Synchronizing transactions...";

      try {
        const result = await apiRequest(
          "/api/transactions/sync",
          {
            method: "POST",
            body: "{}"
          }
        );

        const total = (result.results || []).length;
        const failures = (result.results || [])
          .filter(item => item.ok === false).length;

        syncResultElement.textContent =
          `${total} connections checked, ` +
          `${failures} failed.`;

        await loadAccounts();
      } catch (err) {
        syncResultElement.textContent =
          err.message;
      } finally {
        syncButton.disabled = false;
      }
    }

    function openPlaid(linkToken, returning = false) {
      if (!window.Plaid) {
        throw new Error("Plaid Link could not load.");
      }

      if (currentHandler) {
        try {
          currentHandler.destroy();
        } catch {
          // Ignore cleanup failures.
        }
        currentHandler = null;
      }

      const options = {
        token: linkToken,

        onSuccess: async (publicToken, metadata) => {
          if (
            typeof publicToken !== "string" ||
            !activeSessionId
          ) {
            setStatus(
              "No completed banking session was received."
            );
            return;
          }

          try {
            setStatus(
              "Saving Sandbox bank connection..."
            );

            // Metadata is not treated as independent
            // proof of session ownership.
            await apiRequest(
              "/api/plaid/web/exchange",
              {
                method: "POST",
                body: JSON.stringify({
                  session_id: activeSessionId,
                  public_token: publicToken
                })
              }
            );

            clearSession();

            setStatus(
              "Test bank connection saved successfully."
            );

            await loadAccounts();
          } catch (err) {
            setStatus(err.message);
          }
        },

        onExit: (err) => {
          if (err) {
            setStatus(
              "Plaid could not complete the connection."
            );
          } else {
            setStatus(
              "Bank connection window closed."
            );
          }
        },

        onEvent: () => {
          // Never log bank credentials or tokens.
        }
      };

      if (returning) {
        options.receivedRedirectUri =
          window.location.href;
      }

      currentHandler =
        window.Plaid.create(options);

      currentHandler.open();
    }

    async function beginLink() {
      if (!verified || !sandboxEnabled) {
        setStatus(
          "Bank linking has not been enabled."
        );
        return;
      }

      connectButton.disabled = true;

      try {
        setStatus(
          "Creating secure test connection..."
        );

        const result = await apiRequest(
          "/api/plaid/web/link-token",
          {
            method: "POST",
            body: "{}"
          }
        );

        activeSessionId = result.session_id;

        sessionStorage.setItem(
          "bs_link_session_id",
          activeSessionId
        );

        openPlaid(result.link_token);
      } catch (err) {
        setStatus(err.message);
      } finally {
        connectButton.disabled = !sandboxEnabled;
      }
    }

    async function resumeOAuth() {
      if (!isOAuthReturn || !sandboxEnabled) {
        return;
      }

      activeSessionId =
        sessionStorage.getItem(
          "bs_link_session_id"
        );

      if (!activeSessionId) {
        setStatus(
          "The original banking session was not found. " +
          "Open BudgetSaver and start again."
        );
        return;
      }

      try {
        const response = await apiRequest(
          "/api/plaid/web/resume",
          {
            method: "POST",
            body: JSON.stringify({
              session_id: activeSessionId
            })
          }
        );

        setStatus(
          "Resuming Plaid authorization..."
        );

        openPlaid(response.link_token, true);
      } catch (err) {
        clearSession();
        setStatus(err.message);
      }
    }

    document.getElementById("loginForm")
      .addEventListener("submit", async event => {
        event.preventDefault();

        const email =
          document.getElementById("email").value;

        const passwordElement =
          document.getElementById("password");

        const password = passwordElement.value;
        passwordElement.value = "";

        const signInButton =
          document.getElementById("signIn");

        signInButton.disabled = true;

        try {
          setStatus("Signing in...");

          await setPersistence(
            auth,
            browserLocalPersistence
          );

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );
        } catch {
          setStatus(
            "Sign-in failed. Check your credentials."
          );
        } finally {
          signInButton.disabled = false;
        }
      });

    connectButton.addEventListener(
      "click",
      beginLink
    );

    refreshButton.addEventListener(
      "click",
      loadAccounts
    );

    syncButton.addEventListener(
      "click",
      syncTransactions
    );

    document.getElementById("signOut")
      .addEventListener("click", async () => {
        clearSession();
        verified = false;
        sandboxEnabled = false;
        await signOut(auth);
      });

    onAuthStateChanged(auth, async user => {
      currentUser = user;
      verified = false;
      sandboxEnabled = false;
      startupCompleted = false;

      connectButton.disabled = true;

      loginSection.classList.toggle(
        "hidden",
        !!user
      );

      bankSection.classList.toggle(
        "hidden",
        !user
      );

      if (!user) {
        accountsElement.replaceChildren();
        setStatus("Sign in to continue.");
        return;
      }

      try {
        await verifyAccount();
        verified = true;

        await loadPlaidStatus();

        setStatus("Secure login verified.");

        await loadAccounts();

        if (isOAuthReturn && !startupCompleted) {
          startupCompleted = true;
          await resumeOAuth();
        }
      } catch {
        verified = false;
        connectButton.disabled = true;

        setStatus(
          "This account could not be authorized."
        );
      }
    });
  </script>
</body>
</html>
