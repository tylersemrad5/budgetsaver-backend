<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">

  <title>BudgetSaver | Connect USAA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #f4f6fa;
      color: #172033;
    }

    main {
      max-width: 480px;
      margin: 6vh auto;
      padding: 28px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 12px 40px #17203312;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 6px;
    }

    h2 {
      font-size: 22px;
      margin: 24px 0 10px;
    }

    p {
      color: #5c6678;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-top: 16px;
    }

    input,
    button {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      margin-top: 11px;
      border-radius: 12px;
      font: inherit;
    }

    input {
      border: 1px solid #cbd5e1;
    }

    button {
      border: none;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      background: #edf2f8;
      color: #172033;
    }

    .hidden {
      display: none !important;
    }

    .notice {
      padding: 14px;
      background: #edf5ff;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
    }

    .warning {
      background: #fff3df;
    }

    .account {
      padding: 15px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .account strong {
      display: block;
      margin-bottom: 4px;
    }

    .account span {
      display: block;
      color: #64748b;
      font-size: 13px;
      margin-top: 4px;
    }

    #status,
    #connectionStatus {
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main>
    <h1>BudgetSaver</h1>
    <p>Private banking connection</p>

    <section id="login">
      <h2>Sign in</h2>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="signIn" type="submit">
          Sign In
        </button>
      </form>
    </section>

    <section id="bank" class="hidden">
      <h2>Connect a Bank</h2>

      <div id="modeNotice" class="notice">
        Checking banking connection availability...
      </div>

      <button id="connect" disabled>
        Connect USAA
      </button>

      <div id="connectionStatus"></div>

      <button id="checkStatus" class="secondary">
        Check Connection Status
      </button>

      <h2>Connected Accounts</h2>

      <button id="refresh" class="secondary">
        Refresh Account Balances
      </button>

      <button id="sync" class="secondary">
        Synchronize Transactions
      </button>

      <div id="accounts"></div>
      <div id="transactionSummary"></div>

      <button id="signOut" class="secondary">
        Sign Out
      </button>
    </section>

    <p id="status" role="status" aria-live="polite">
      Loading authentication...
    </p>
  </main>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIw9TYrf-OuHrTHvPONADexrfsMK0lw3E",
      authDomain: "budgetsaver-f76a9.firebaseapp.com",
      projectId: "budgetsaver-f76a9",
      storageBucket: "budgetsaver-f76a9.firebasestorage.app",
      messagingSenderId: "360891693628",
      appId: "1:360891693628:web:01ba8b47bf841e0adca139",
      measurementId: "G-1XDB1T7MBN"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginSection =
      document.getElementById("login");

    const bankSection =
      document.getElementById("bank");

    const statusElement =
      document.getElementById("status");

    const modeNotice =
      document.getElementById("modeNotice");

    const connectButton =
      document.getElementById("connect");

    const connectionStatus =
      document.getElementById("connectionStatus");

    const accountsElement =
      document.getElementById("accounts");

    const transactionSummary =
      document.getElementById("transactionSummary");

    let currentUser = null;
    let verified = false;
    let linkingEnabled = false;
    let currentSessionId = null;

    let refreshTimer = null;

    function setStatus(message) {
      statusElement.textContent = message;
    }

    function setConnectionStatus(message) {
      connectionStatus.textContent = message;
    }

    async function api(path, options = {}) {
      if (!currentUser) {
        throw new Error("Please sign in first.");
      }

      const token = await currentUser.getIdToken();

      const response = await fetch(path, {
        ...options,
        cache: "no-store",
        headers: {
          Authorization: "Bearer " + token,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error(
          "Invalid response from BudgetSaver."
        );
      }

      if (!response.ok) {
        throw new Error(
          data.error || "Request failed"
        );
      }

      return data;
    }

    function stopChecking() {
      if (refreshTimer) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
    }

    async function verifyLogin() {
      const response = await api("/api/auth/me");

      if (response.authenticated !== true) {
        throw new Error("Account not authorized.");
      }
    }

    async function loadPlaidStatus() {
      const response = await api(
        "/api/plaid/status"
      );

      linkingEnabled =
        response.linking_enabled === true &&
        response.hosted_link === true;

      if (!linkingEnabled) {
        modeNotice.classList.add("warning");

        modeNotice.textContent =
          "Plaid Production is configured, but " +
          "the live USAA connection is locked " +
          "until the security checks are approved.";

        connectButton.disabled = true;
        connectButton.textContent =
          "Bank Connection Not Available";
      } else {
        modeNotice.classList.remove("warning");

        modeNotice.textContent =
          response.environment === "production"
            ? "Real bank connection enabled. " +
              "Plaid will handle USAA authorization."
            : "Plaid Sandbox testing is enabled.";

        connectButton.disabled = false;
        connectButton.textContent =
          response.environment === "production"
            ? "Connect USAA"
            : "Connect Test Bank";
      }
    }

    async function checkConnection() {
      if (!verified) return;

      try {
        let sessionId = currentSessionId;

        if (!sessionId) {
          const latest = await api(
            "/api/plaid/hosted/latest"
          );

          sessionId = latest.session?.id;

          if (!sessionId) {
            setConnectionStatus(
              "No recent bank connection attempt."
            );
            return;
          }

          currentSessionId = sessionId;
        }

        const result = await api(
          "/api/plaid/hosted/status?session_id=" +
          encodeURIComponent(sessionId)
        );

        const session = result.session;

        if (session.status === "complete") {
          stopChecking();

          setConnectionStatus(
            "Bank connection completed successfully."
          );

          await loadAccounts();
          await syncTransactions();
        } else if (session.status === "error") {
          stopChecking();

          setConnectionStatus(
            "The bank connection could not be completed."
          );
        } else if (session.status === "processing") {
          setConnectionStatus(
            "Plaid authorization received. " +
            "Saving the connection..."
          );
        } else {
          setConnectionStatus(
            "Waiting for bank authorization to finish..."
          );
        }
      } catch (error) {
        setConnectionStatus(error.message);
      }
    }

    function startChecking() {
      stopChecking();

      refreshTimer = setInterval(() => {
        if (
          verified &&
          !document.hidden
        ) {
          checkConnection();
        }
      }, 5000);
    }

    async function connectBank() {
      if (!verified || !linkingEnabled) {
        return;
      }

      connectButton.disabled = true;

      try {
        setConnectionStatus(
          "Preparing secure Plaid connection..."
        );

        const popup = window.open(
          "about:blank",
          "_blank"
        );

        if (!popup) {
          throw new Error(
            "Safari blocked the banking tab. " +
            "Allow pop-ups and try again."
          );
        }

        try {
          const result = await api(
            "/api/plaid/hosted/start",
            {
              method: "POST",
              body: "{}"
            }
          );

          currentSessionId = result.session_id;

          const url = new URL(
            result.hosted_link_url
          );

          if (
            url.protocol !== "https:" ||
            url.hostname !== "secure.plaid.com"
          ) {
            throw new Error(
              "Unexpected Plaid URL"
            );
          }

          popup.location.replace(url.href);

          setConnectionStatus(
            "Plaid opened in a new tab. " +
            "Complete USAA authorization there, " +
            "then return to BudgetSaver."
          );

          startChecking();
        } catch (error) {
          popup.close();
          throw error;
        }
      } catch (error) {
        setConnectionStatus(error.message);
      } finally {
        connectButton.disabled = !linkingEnabled;
      }
    }

    function displayAccounts(accounts) {
      accountsElement.replaceChildren();

      if (!accounts.length) {
        const empty = document.createElement("p");
        empty.textContent =
          "No connected accounts yet.";
        accountsElement.appendChild(empty);
        return;
      }

      for (const account of accounts) {
        const row = document.createElement("div");
        row.className = "account";

        const name = document.createElement("strong");
        name.textContent =
          account.name || "Bank account";

        const details = document.createElement("span");
        details.textContent = account.mask
          ? "Account ending in " + account.mask
          : "Account details unavailable";

        const balance = document.createElement("span");
        const amount = Number(
          account.current_balance
        );

        balance.textContent =
          account.current_balance != null &&
          Number.isFinite(amount)
            ? amount.toLocaleString("en-US", {
                style: "currency",
                currency: "USD"
              })
            : "Balance unavailable";

        const updated = document.createElement("span");
        updated.textContent = account.updated_at
          ? "Last recorded: " +
            new Date(
              account.updated_at
            ).toLocaleString()
          : "Not refreshed yet";

        row.appendChild(name);
        row.appendChild(details);
        row.appendChild(balance);
        row.appendChild(updated);

        accountsElement.appendChild(row);
      }
    }

    async function loadAccounts() {
      if (!verified) return;

      try {
        const result = await api("/api/accounts");
        displayAccounts(result.accounts || []);
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function refreshAccounts() {
      if (!verified) return;

      setStatus("Updating bank balances...");

      try {
        await api(
          "/api/accounts/refresh",
          {
            method: "POST",
            body: "{}"
          }
        );

        await loadAccounts();
        setStatus("Account refresh completed.");
      } catch (error) {
        setStatus(error.message);
      }
    }

    async function syncTransactions() {
      if (!verified) return;

      setStatus("Synchronizing transactions...");

      try {
        const sync = await api(
          "/api/transactions/sync",
          {
            method: "POST",
            body: "{}"
          }
        );

        const failed = (sync.results || [])
          .filter(item => item.ok === false)
          .length;

        const data = await api(
          "/api/transactions"
        );

        const transactions = data.transactions || [];

        const plaidTransactions = transactions.filter(
          item => item.source === "plaid"
        );

        transactionSummary.textContent =
          `${plaidTransactions.length} bank transactions loaded. ` +
          `${failed} connections reported sync errors.`;

        setStatus(
          failed
            ? "Some accounts need synchronization attention."
            : "Transaction synchronization completed."
        );
      } catch (error) {
        setStatus(error.message);
      }
    }

    document.getElementById("loginForm")
      .addEventListener(
        "submit",
        async event => {
          event.preventDefault();

          const email = document
            .getElementById("email").value;

          const passwordInput = document
            .getElementById("password");

          const password = passwordInput.value;
          passwordInput.value = "";

          const button = document
            .getElementById("signIn");

          button.disabled = true;

          try {
            setStatus("Signing in...");

            await setPersistence(
              auth,
              browserLocalPersistence
            );

            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );
          } catch {
            setStatus(
              "Sign-in failed. Check your credentials."
            );
          } finally {
            button.disabled = false;
          }
        }
      );

    connectButton.addEventListener(
      "click",
      connectBank
    );

    document.getElementById("checkStatus")
      .addEventListener(
        "click",
        checkConnection
      );

    document.getElementById("refresh")
      .addEventListener(
        "click",
        refreshAccounts
      );

    document.getElementById("sync")
      .addEventListener(
        "click",
        syncTransactions
      );

    document.getElementById("signOut")
      .addEventListener(
        "click",
        async () => {
          stopChecking();
          currentSessionId = null;
          verified = false;
          linkingEnabled = false;

          await signOut(auth);
        }
      );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden && verified) {
          checkConnection();
        }
      }
    );

    onAuthStateChanged(
      auth,
      async user => {
        currentUser = user;
        verified = false;
        linkingEnabled = false;

        connectButton.disabled = true;

        loginSection.classList.toggle(
          "hidden",
          !!user
        );

        bankSection.classList.toggle(
          "hidden",
          !user
        );

        if (!user) {
          stopChecking();
          accountsElement.replaceChildren();
          setStatus("Sign in to continue.");
          return;
        }

        try {
          await verifyLogin();
          verified = true;

          await loadPlaidStatus();

          setStatus(
            "Secure login verified."
          );

          await loadAccounts();
          await checkConnection();
        } catch (error) {
          verified = false;
          connectButton.disabled = true;
          setStatus(error.message);
        }
      }
    );
  </script>
</body>
</html>
