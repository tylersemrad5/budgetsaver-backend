
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>BudgetSaver | Connect Bank</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: #f4f6fa;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      color: #172033;
    }

    main {
      max-width: 460px;
      margin: 8vh auto;
      background: white;
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 12px 45px #17203312;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #586579;
      line-height: 1.5;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 12px;
      font-size: 16px;
    }

    input {
      border: 1px solid #cbd5e1;
    }

    button {
      background: #2563eb;
      color: white;
      border: 0;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      background: #eef2f8;
      color: #172033;
    }

    .hidden {
      display: none;
    }

    #status {
      font-size: 14px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main>
    <h1>BudgetSaver</h1>
    <p>Secure bank connection</p>

    <section id="login">
      <h2>Sign in</h2>

      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="username"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="signIn">
        Sign In
      </button>
    </section>

    <section id="bank" class="hidden">
      <h2>Connect USAA</h2>

      <p>
        Authorize a read-only financial data
        connection through Plaid.
      </p>

      <button id="connect" disabled>
        Connect Bank
      </button>

      <button id="signOut" class="secondary">
        Sign Out
      </button>
    </section>

    <p id="status" role="status"></p>
  </main>

  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    // Copy these values from:
    // Firebase > Project Settings > Your Web App
    //
    // These are public client configuration values.
    // Never include a Firebase service-account key.

    const firebaseConfig = {
  apiKey: "AIzaSyDIw9TYrf-OuHrTHvPONADexrfsMK0lw3E",
  authDomain: "budgetsaver-f76a9.firebaseapp.com",
  projectId: "budgetsaver-f76a9",
  storageBucket: "budgetsaver-f76a9.firebasestorage.app",
  messagingSenderId: "360891693628",
  appId: "1:360891693628:web:01ba8b47bf841e0adca139",
  measurementId: "G-1XDB1T7MBN"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginSection =
      document.getElementById("login");

    const bankSection =
      document.getElementById("bank");

    const status =
      document.getElementById("status");

    const connectButton =
      document.getElementById("connect");

    let currentUser = null;

    const redirectURI =
      window.location.origin + "/plaid/oauth";

    const isOAuthReturn =
      window.location.pathname === "/plaid/oauth";

    function setStatus(message) {
      status.textContent = message;
    }

    async function apiRequest(path, options = {}) {
      if (!currentUser) {
        throw new Error("Please sign in first.");
      }

      const token =
        await currentUser.getIdToken();

      const response = await fetch(path, {
        ...options,
        cache: "no-store",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "Request failed"
        );
      }

      return data;
    }

    async function verifyAccount() {
      const result = await apiRequest(
        "/api/auth/me"
      );

      if (!result.authenticated) {
        throw new Error(
          "Account not authorized."
        );
      }
    }

    function openLink(linkToken, returning) {
      if (!window.Plaid) {
        throw new Error(
          "Plaid Link could not load."
        );
      }

      const options = {
        token: linkToken,

        onSuccess: async (publicToken) => {
          if (!publicToken) {
            setStatus(
              "No public token received."
            );
            return;
          }

          try {
            setStatus(
              "Saving bank connection..."
            );

            await apiRequest(
              "/api/plaid/exchange",
              {
                method: "POST",
                body: JSON.stringify({
                  public_token: publicToken
                })
              }
            );

            localStorage.removeItem(
              "bs_plaid_link_token"
            );

            setStatus(
              "Bank connection saved. " +
              "Account synchronization is next."
            );

          } catch (error) {
            setStatus(error.message);
          }
        },

        onExit: (error) => {
          if (error) {
            setStatus(
              "Plaid could not complete " +
              "the connection."
            );
          } else {
            setStatus(
              "Connection closed."
            );
          }
        }
      };

      if (returning) {
        options.receivedRedirectUri =
          window.location.href;
      }

      const handler =
        window.Plaid.create(options);

      handler.open();
    }

    async function connectBank() {
      connectButton.disabled = true;

      try {
        await verifyAccount();

        setStatus(
          "Preparing secure bank connection..."
        );

        const response = await apiRequest(
          "/api/plaid/web/link-token",
          {
            method: "POST",
            body: JSON.stringify({})
          }
        );

        localStorage.setItem(
          "bs_plaid_link_token",
          response.link_token
        );

        openLink(
          response.link_token,
          false
        );

      } catch (error) {
        setStatus(error.message);
      } finally {
        connectButton.disabled = false;
      }
    }

    async function resumeOAuth() {
      const linkToken = localStorage.getItem(
        "bs_plaid_link_token"
      );

      if (!linkToken) {
        setStatus(
          "Original connection session " +
          "was not found. Start again."
        );
        return;
      }

      try {
        await verifyAccount();

        setStatus(
          "Resuming bank authorization..."
        );

        openLink(linkToken, true);

      } catch (error) {
        setStatus(error.message);
      }
    }

    document.getElementById("signIn")
      .addEventListener("click", async () => {
        const email =
          document.getElementById("email").value;

        const password =
          document.getElementById("password").value;

        try {
          await setPersistence(
            auth,
            browserLocalPersistence
          );

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          document.getElementById(
            "password"
          ).value = "";

        } catch {
          setStatus(
            "Sign-in failed. Check your credentials."
          );
        }
      });

    document.getElementById("connect")
      .addEventListener("click", connectBank);

    document.getElementById("signOut")
      .addEventListener("click", async () => {
        localStorage.removeItem(
          "bs_plaid_link_token"
        );

        await signOut(auth);
      });

    onAuthStateChanged(
      auth,
      async (user) => {
        currentUser = user;

        loginSection.classList.toggle(
          "hidden",
          !!user
        );

        bankSection.classList.toggle(
          "hidden",
          !user
        );

        connectButton.disabled = true;

        if (!user) {
          setStatus(
            "Sign in to continue."
          );
          return;
        }

        try {
          await verifyAccount();

          connectButton.disabled = false;

          setStatus(
            "Secure login verified."
          );

          if (isOAuthReturn) {
            await resumeOAuth();
          }

        } catch {
          setStatus(
            "This account is not authorized."
          );
        }
      }
    );
  </script>
</body>
</html>
