<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>BudgetSaver | Connect USAA</title>
  <style>
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; padding:24px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#172033; background:#f4f6fa;
    }
    main {
      width:100%; max-width:480px; margin:6vh auto;
      background:white; padding:28px; border-radius:24px;
      box-shadow:0 12px 40px #17203312;
    }
    h1 { margin:0 0 8px; font-size:32px; }
    h2 { margin:24px 0 10px; font-size:22px; }
    p { color:#5c6678; line-height:1.5; }
    label {
      display:block; font-size:14px;
      font-weight:600; margin-top:16px;
    }
    input,button {
      display:block; width:100%; min-height:46px;
      padding:12px 14px; margin-top:10px;
      border-radius:12px; font:inherit;
    }
    input { border:1px solid #cbd5e1; }
    button {
      border:0; background:#2563eb; color:#fff;
      cursor:pointer; font-weight:600;
    }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .secondary { background:#edf2f8; color:#172033; }
    .hidden { display:none!important; }
    .notice {
      padding:14px; background:#edf5ff;
      border-radius:12px; font-size:14px; line-height:1.5;
    }
    .warning { background:#fff3df; }
    .account {
      padding:14px 0;
      border-bottom:1px solid #e5e7eb;
    }
    .account strong { display:block; margin-bottom:4px; }
    .account span {
      display:block; color:#64748b;
      font-size:13px; margin-top:4px;
    }
    #status,#connectionStatus,#transactionSummary {
      overflow-wrap:anywhere; line-height:1.5;
      font-size:14px; margin-top:14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>BudgetSaver</h1>
    <p>Secure banking connections</p>

    <section id="login">
      <h2>Sign In</h2>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password"
          autocomplete="current-password" required>
        <button id="signIn" type="submit">Sign In</button>
      </form>
    </section>

    <section id="bank" class="hidden">
      <h2>Bank Connection</h2>
      <div id="modeNotice" class="notice">
        Checking connection availability...
      </div>

      <button id="connect" disabled>Connect USAA</button>
      <div id="connectionStatus"></div>
      <button id="checkStatus" class="secondary">
        Check Connection Status
      </button>
      <button id="recover" class="secondary">
        Recover Connection
      </button>

      <h2>Connected Accounts</h2>
      <button id="refresh" class="secondary">
        Refresh Balances
      </button>
      <button id="sync" class="secondary">
        Sync Transactions
      </button>
      <div id="accounts"></div>
      <div id="transactionSummary"></div>

      <button id="signOut" class="secondary">Sign Out</button>
    </section>

    <p id="status" role="status" aria-live="polite">
      Loading authentication...
    </p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import {
      getAuth, setPersistence, browserLocalPersistence,
      signInWithEmailAndPassword, signOut, onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    const config = {
      apiKey: "AIzaSyDIw9TYrf-OuHrTHvPONADexrfsMK0lw3E",
      authDomain: "budgetsaver-f76a9.firebaseapp.com",
      projectId: "budgetsaver-f76a9",
      storageBucket: "budgetsaver-f76a9.firebasestorage.app",
      messagingSenderId: "360891693628",
      appId: "1:360891693628:web:01ba8b47bf841e0adca139",
      measurementId: "G-1XDB1T7MBN"
    };

    const auth = getAuth(initializeApp(config));
    const $ = id => document.getElementById(id);

    let user = null;
    let verified = false;
    let linkingEnabled = false;
    let sessionId = null;
    let polling = null;

    function status(message) { $("status").textContent = message; }
    function connection(message) {
      $("connectionStatus").textContent = message;
    }

    async function api(endpoint, options = {}) {
      if (!user) throw Error("Please sign in first.");

      const token = await user.getIdToken();
      const response = await fetch(endpoint, {
        ...options,
        cache:"no-store",
        headers:{
          Authorization:`Bearer ${token}`,
          "Content-Type":"application/json",
          ...(options.headers || {})
        }
      });
      const data = await response.json().catch(() => ({
        error:"Invalid server response"
      }));
      if (!response.ok) throw Error(data.error || "Request failed");
      return data;
    }

    function stopPolling() {
      if (polling !== null) {
        clearInterval(polling);
        polling = null;
      }
    }

    async function loadStatus() {
      const result = await api("/api/plaid/status");
      linkingEnabled = result.linking_enabled === true &&
        result.hosted_link === true;
      $("connect").disabled = !linkingEnabled;
      $("recover").disabled = !linkingEnabled;

      const notice = $("modeNotice");
      notice.classList.toggle("warning", !linkingEnabled);
      notice.textContent = linkingEnabled
        ? result.environment === "production"
          ? "Real banking authorization is enabled."
          : "Plaid Sandbox test connections are enabled."
        : "Live USAA connection is locked until the security checks pass.";

      $("connect").textContent =
        result.environment === "production"
          ? "Connect USAA" : "Connect Test Bank";
    }

    async function loadAccounts() {
      if (!verified) return;
      const result = await api("/api/accounts");
      const container = $("accounts");
      container.replaceChildren();

      const accounts = result.accounts || [];
      if (!accounts.length) {
        const p = document.createElement("p");
        p.textContent = "No connected accounts yet.";
        container.appendChild(p);
      }

      for (const a of accounts) {
        const row = document.createElement("div");
        row.className = "account";
        const title = document.createElement("strong");
        title.textContent = a.name || "Bank account";

        const mask = document.createElement("span");
        mask.textContent = a.mask
          ? `Ending in ${a.mask}` : "Account mask unavailable";

        const balance = document.createElement("span");
        const value = Number(a.current_balance);
        balance.textContent =
          a.current_balance != null && Number.isFinite(value)
            ? value.toLocaleString("en-US",{
                style:"currency",currency:"USD"
              })
            : "Balance unavailable";

        row.append(title,mask,balance);
        container.appendChild(row);
      }
    }

    async function checkConnection() {
      if (!verified) return;

      if (!sessionId) {
        const latest = await api("/api/plaid/hosted/latest");
        sessionId = latest.session?.id || null;
      }
      if (!sessionId) {
        connection("No recent connection attempt.");
        return;
      }

      const result = await api(
        "/api/plaid/hosted/status?session_id=" +
        encodeURIComponent(sessionId)
      );
      const s = result.session;

      if (s.status === "complete") {
        stopPolling();
        connection("Bank connection completed.");
        await loadAccounts();
      } else if (s.status === "error") {
        stopPolling();
        connection("Connection failed. Recovery may be available.");
      } else if (s.status === "processing") {
        connection("Plaid authorization is being processed.");
      } else {
        connection("Waiting for Plaid authorization.");
      }
    }

    async function recoverConnection() {
      if (!verified || !linkingEnabled) return;
      $("recover").disabled = true;
      try {
        if (!sessionId) {
          const latest = await api("/api/plaid/hosted/latest");
          sessionId = latest.session?.id || null;
        }
        if (!sessionId) {
          connection("No connection to recover.");
          return;
        }
        connection("Checking Plaid for the completed session...");
        const result = await api("/api/plaid/hosted/recover",{
          method:"POST",
          body:JSON.stringify({session_id:sessionId})
        });
        connection(result.message ||
          `Connection recovery status: ${result.status}`);
        await checkConnection();
      } catch (err) {
        connection(err.message);
      } finally {
        $("recover").disabled = !linkingEnabled;
      }
    }

    async function connectBank() {
      if (!verified || !linkingEnabled) return;
      $("connect").disabled = true;

      // Open synchronously from the user's click to avoid
      // Safari blocking a window opened after fetch().
      const popup = window.open("about:blank","_blank");

      if (!popup) {
        connection("Allow pop-ups, then try again.");
        $("connect").disabled = false;
        return;
      }

      try {
        connection("Creating Plaid Hosted Link...");
        const result = await api("/api/plaid/hosted/start",{
          method:"POST",body:"{}"
        });

        const url = new URL(result.hosted_link_url);
        if (url.protocol !== "https:" ||
            url.hostname !== "secure.plaid.com") {
          throw Error("Unrecognized Plaid URL");
        }

        sessionId = result.session_id;
        popup.location.replace(url.href);
        connection(
          "Finish authorization in the Plaid tab, then return here."
        );

        stopPolling();
        polling = setInterval(() => {
          if (verified && !document.hidden) {
            checkConnection().catch(err => connection(err.message));
          }
        },5000);
      } catch(err) {
        popup.close();
        connection(err.message);
      } finally {
        $("connect").disabled = !linkingEnabled;
      }
    }

    async function refreshAccounts() {
      $("refresh").disabled = true;
      try {
        status("Refreshing balances...");
        await api("/api/accounts/refresh",{
          method:"POST",body:"{}"
        });
        await loadAccounts();
        status("Account balances refreshed.");
      } catch(err) {
        status(err.message);
      } finally {
        $("refresh").disabled = false;
      }
    }

    async function syncTransactions() {
      $("sync").disabled = true;
      try {
        status("Syncing transactions...");
        const result = await api("/api/transactions/sync",{
          method:"POST",body:"{}"
        });
        const failed = (result.results || [])
          .filter(x => x.ok === false).length;
        const data = await api("/api/transactions");
        const count = (data.transactions || [])
          .filter(x => x.source === "plaid").length;

        $("transactionSummary").textContent =
          `${count} bank transactions loaded; ${failed} sync failures.`;
        status("Transaction synchronization finished.");
      } catch(err) {
        status(err.message);
      } finally {
        $("sync").disabled = false;
      }
    }

    $("loginForm").addEventListener("submit",async event => {
      event.preventDefault();
      $("signIn").disabled = true;
      const email = $("email").value;
      const password = $("password").value;
      $("password").value = "";
      try {
        status("Signing in...");
        await setPersistence(auth,browserLocalPersistence);
        await signInWithEmailAndPassword(auth,email,password);
      } catch {
        status("Sign-in unsuccessful. Check your credentials.");
      } finally {
        $("signIn").disabled = false;
      }
    });

    $("connect").addEventListener("click",connectBank);
    $("recover").addEventListener("click",recoverConnection);
    $("checkStatus").addEventListener("click",() =>
      checkConnection().catch(err => connection(err.message))
    );
    $("refresh").addEventListener("click",refreshAccounts);
    $("sync").addEventListener("click",syncTransactions);

    $("signOut").addEventListener("click",async () => {
      stopPolling();
      verified = false;
      linkingEnabled = false;
      sessionId = null;
      await signOut(auth);
    });

    document.addEventListener("visibilitychange",() => {
      if (verified && !document.hidden) {
        checkConnection().catch(() => {});
      }
    });

    onAuthStateChanged(auth,async nextUser => {
      user = nextUser;
      verified = false;
      linkingEnabled = false;
      $("login").classList.toggle("hidden",!!user);
      $("bank").classList.toggle("hidden",!user);
      $("connect").disabled = true;
      $("recover").disabled = true;

      if (!user) {
        stopPolling();
        $("accounts").replaceChildren();
        status("Sign in to continue.");
        return;
      }

      try {
        const me = await api("/api/auth/me");
        if (me.authenticated !== true) {
          throw Error("Account not authorized");
        }
        verified = true;
        await loadStatus();
        await loadAccounts();
        status("Secure login verified.");
        await checkConnection();
      } catch(err) {
        status(err.message);
        verified = false;
        $("connect").disabled = true;
      }
    });
  </script>
</body>
</html>
